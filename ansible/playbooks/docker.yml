---
# Usage:
# install docker engine on all kvm hosts (weekly cleanup is always deployed)
#   ansible-playbook -i inventories/init.ini playbooks/docker.yml --limit kvm
# install with a custom cleanup policy (daily, prune images older than 72h)
#   ansible-playbook -i inventories/init.ini playbooks/docker.yml --limit kvm \
#     -e "docker_cleanup_schedule=daily docker_cleanup_image_age=72h"

- hosts: all
  remote_user: root
  become: true
  become_method: su
  roles:
    - docker
