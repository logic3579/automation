[defaults]
# Paths (resolved relative to this ansible.cfg's directory)
inventory = inventories/hosts.ini
roles_path = roles
log_path = ~/.ansible/ansible.log

# Fact caching: skip gather_facts when a fresh JSON cache exists
# (cache is user-shared so multiple projects can reuse the same fact snapshot)
gathering = smart
fact_caching = jsonfile
fact_caching_timeout = 86400
fact_caching_connection = ~/.ansible/cache

# Output: per-task YAML rendering + timing breakdown at end of play
stdout_callback = yaml
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

# Run pending handlers even when earlier tasks fail (e.g. don't leave the
# firewall half-deployed because a later role hit a transient error)
force_handlers = True

# Performance
forks = 50
poll_interval = 1

# Bootstrap targets are new hosts without recorded SSH host keys; disable
# strict checking here rather than per-playbook
host_key_checking = False

[inventory]
cache = True
cache_plugin = jsonfile
unparsed_is_failed = True

[ssh_connection]
retries = 3
pipelining = True
timeout = 120
control_path = %(directory)s/%%h-%%r
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey,password
