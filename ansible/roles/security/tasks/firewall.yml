---
- name: Install iptables packages
  ansible.builtin.package:
    name:
      - iptables
      - iptables-persistent
    state: present

- name: Ensure sysconfig directory exists
  ansible.builtin.file:
    path: /etc/sysconfig
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy iptables rules
  ansible.builtin.template:
    src: iptables.rules.j2
    dest: /etc/sysconfig/iptables
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Restart iptables

# Force handlers to run now: kvm-init.yml runs sshd after security in the
# same play, so the new firewall rules must be active before SSH port changes.
- name: Apply iptables rules immediately
  ansible.builtin.meta: flush_handlers
