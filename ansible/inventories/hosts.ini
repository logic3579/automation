# Service inventory (default in ansible.cfg).
# Groups are split by component and deployment topology so playbooks can target
# the matching `--limit <group>` together with the right mode toggle.

# ----- Nginx -----
[nginx_standalone_kvm]
10.0.0.10

# ----- Kafka -----
# Standalone: single broker, replication factor 1
[kafka_standalone_kvm]
10.0.0.1

# 3-node KRaft cluster: pass -e kafka_cluster_enabled=yes
[kafka_cluster_kvm]
10.0.0.[11:13]

# ----- Redis -----
# Standalone: single instance on port 6379
[redis_standalone_kvm]
10.0.1.1

# 3M3S cluster: 3 hosts, each runs 2 instances on ports 7001-7006
# Pass -e redis_cluster_enabled=yes
[redis_cluster_kvm]
10.0.1.[11:13]

# ----- RocketMQ -----
# Standalone: 1 host runs 1 namesrv + 1 broker
[rocketmq_standalone_kvm]
10.0.2.1

# 2m-2s-sync: 2 hosts, each runs namesrv + master + slave (cross-paired)
# Pass -e rocketmq_mode=2m-2s-sync
[rocketmq_2m2s_kvm]
10.0.2.[11:12]

# Failover (DLedger): >=3 hosts for Raft quorum, each runs namesrv + DLedger broker
# Pass -e rocketmq_mode=failover
[rocketmq_failover_kvm]
10.0.2.[21:23]
