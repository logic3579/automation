---
# Self-hosted KVM/bare-metal initialization playbook.
#
# Bootstrap connection is fixed at root@22. Replace the vault placeholder below
# with the actual encrypted root password:
#   uv run ansible-vault encrypt_string 'your_root_password' \
#     --name 'ansible_ssh_pass' --vault-id pwd.vault
#
# Usage:
#   uv run ansible-playbook -i inventories/init.ini playbooks/kvm-init.yml \
#     --vault-id pwd.vault
- name: KVM bootstrap
  hosts: kvm
  vars:
    ansible_user: root
    ansible_port: 22
    ansible_ssh_pass: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      31626630386363616332343237613935353564623839663239663733643933323436336432376535
      3639343335393235626531633163633534313737616666660a633335303465396366353234356136
      66356237623337346266646134313031363761633566373134353030636435303535353631346631
      6333353862363435350a333433663433376364666336633866663162326264616139633438623062
      3537
    user_ssh_public_key: "{{ lookup('file', playbook_dir ~ '/../keys/devops_key.pub') }}"
    sshd_port: 2233
    security_allowed_tcp_ports:
      - 2233
  roles:
    - hostname
    - audit
    - ntp
    - security
    - sysctl
    - user
    - sshd
