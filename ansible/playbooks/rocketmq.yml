---
# Usage:
# standalone mode
#   ansible-playbook -i inventories/init.ini playbooks/rocketmq.yml --limit kvm
#   ansible-playbook -i inventories/init.ini playbooks/rocketmq.yml --limit cloud_aws
#   ansible-playbook -i inventories/init.ini playbooks/rocketmq.yml --limit cloud_gcp
# 2m-2s-sync mode
#   ansible-playbook -i inventories/init.ini playbooks/rocketmq.yml --limit kvm
# failover mode
#   ansible-playbook -i inventories/init.ini playbooks/rocketmq.yml --limit kvm

- hosts: all
  remote_user: root
  become: true
  become_method: su
  gather_facts: false
  serial: 1
  roles:
    - rocketmq
