---
# Usage:
# default = VMess on port 443 (UUID + REALITY keys come from defaults/main.yml, vault-encrypted)
#   ansible-playbook -i inventories/init.ini playbooks/xray.yml --limit cloud_vps --vault-id pwd.vault
# Switch to VLESS+REALITY (must populate xray_reality_private_key in vault):
#   ansible-playbook -i inventories/init.ini playbooks/xray.yml --limit cloud_vps \
#     --vault-id pwd.vault -e "xray_protocol=vless-reality"

- hosts: all
  remote_user: devops
  become: true
  become_method: sudo
  roles:
    - xray
