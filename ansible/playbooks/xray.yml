---
# Usage:
# default = VMess on port 443 (UUID + REALITY keys come from defaults/main.yml, vault-encrypted)
#   uv run ansible-playbook playbooks/xray.yml --limit vultr --ask-vault-pass
#   uv run ansible-playbook playbooks/xray.yml --limit vultr --vault-id pwd.vault
# Switch to VLESS+REALITY (must populate xray_reality_private_key in vault):
#   uv run ansible-playbook playbooks/xray.yml --limit vultr \
#     --vault-id pwd.vault -e "xray_protocol=vless-reality"

- name: Deploy Xray
  hosts: all
  become: true
  roles:
    - xray
