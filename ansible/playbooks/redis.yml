---
# Usage:
# standalone (single instance, port 6379)
#   uv run ansible-playbook playbooks/redis.yml --limit redis_standalone_kvm
# 3M3S cluster (3 hosts x 2 instances each on ports 7001-7006, cluster-replicas 1)
#   uv run ansible-playbook playbooks/redis.yml --limit redis_cluster_kvm -e "redis_cluster_enabled=yes"

- name: Deploy Redis
  hosts: all
  become: true
  serial: 1
  roles:
    - redis
