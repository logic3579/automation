---
# Protocol template selector:
#   vmess         - VMess over plain TCP (default; terminate TLS upstream)
#   vless-reality - VLESS + REALITY (TLS fingerprint masquerade)
xray_protocol: vmess

# Inbound listen port (provider security group / VPS network ACL must allow 443)
xray_port: 443

# Client UUID — vault-encrypt before use:
#   uv run ansible-vault encrypt_string 'your_uuid' --name 'xray_uuid' --ask-vault-pass
#   uv run ansible-vault encrypt_string 'your_uuid' --name 'xray_uuid' --vault-id pwd.vault
xray_uuid: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  66383165393934363538333662376535346564393735313562653961353339333661646137303939
  3365363538623434346264613665353261653837343365370a393131383365373865396131656334
  30656234366631363932303464663631636233346436613861303938313862313762386634343161
  6633663861643964310a653931656266353763393433653966393237663634656335346439313036
  65303230663132343434656263306138333433376530383034326436326461336635323461303861
  3164303064613863643435663961383131346638613530336663

# ----- VMess transport -----
# (Plain TCP by default; override if you proxy through nginx/CDN)

# ----- VLESS + REALITY -----
# Generate keypair: /usr/local/bin/xray x25519
# Generate short IDs: openssl rand -hex 8
xray_reality_dest: "www.microsoft.com:443"
xray_reality_server_names:
  - www.microsoft.com
#   uv run ansible-vault encrypt_string 'your_reality_private_key' --name 'xray_reality_private_key' --vault-id pwd.vault
xray_reality_private_key: !vault |
