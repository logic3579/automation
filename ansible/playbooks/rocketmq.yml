---
# Usage:
# standalone mode
#   ansible-playbook -e "hosts_var=10.0.10.12" playbooks/rocketmq.yml
# 2m-2s-sync mode
#   ansible-playbook -e "hosts_var=10.0.10.12,10.0.10.13" playbooks/rocketmq.yml
# failover mode
#   ansible-playbook -e "hosts_var=10.0.10.12,10.0.10.13,10.0.10.14" playbooks/rocketmq.yml

- hosts: "{{ hosts_var }}"
  remote_user: root
  become: true
  become_method: su
  gather_facts: false
  serial: 1
  roles:
    - rocketmq
