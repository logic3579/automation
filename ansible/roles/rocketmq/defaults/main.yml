---
# defaults file for rocketmq
# User-configurable variables

# Installation settings
rocketmq_root_path: /opt/rocketmq
rocketmq_version: "5.5.0"
rocketmq_pkg_url: "https://dist.apache.org/repos/dist/release/rocketmq/{{ rocketmq_version }}/rocketmq-all-{{ rocketmq_version }}-bin-release.zip"

# Deployment mode:
#   standalone   - single namesrv + single broker per host
#   2m-2s-sync   - two hosts, each runs namesrv + 1 master + 1 slave (cross-paired)
#   failover     - N hosts (>=3), each runs namesrv + DLedger-replicated broker
rocketmq_mode: standalone

# Feature toggles
rocketmq_dashboard_enabled: false
rocketmq_exporter_enabled: false

# JVM settings
rocketmq_namesrv_jvm_memory: "-Xms2g -Xmx2g"
rocketmq_broker_jvm_memory: "-Xms2g -Xmx2g"

# Cluster settings
rocketmq_cluster_name: DefaultCluster

# Port settings
rocketmq_namesrv_port: 9876
rocketmq_broker_port: 10911            # standalone + failover broker listen port
rocketmq_master_port: 6888             # 2m-2s-sync master listen port
rocketmq_slave_port: 7888              # 2m-2s-sync slave listen port
rocketmq_dledger_port: 40911           # DLedger Raft RPC port (failover mode)
