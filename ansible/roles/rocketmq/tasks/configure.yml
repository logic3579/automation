---
- name: Create rocketmq group
  ansible.builtin.group:
    name: rocketmq
    state: present

- name: Create rocketmq user
  ansible.builtin.user:
    name: rocketmq
    group: rocketmq
    shell: /sbin/nologin
    create_home: true

- name: Deploy namesrv service unit
  ansible.builtin.template:
    src: rocketmq-namesrv.service.j2
    dest: /etc/systemd/system/rocketmq-namesrv.service
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart rocketmq

- name: Deploy standalone broker configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: rocketmq
    group: rocketmq
    mode: '0644'
    backup: true
  loop:
    - { src: broker.properties.j2, dest: "{{ broker_config }}" }
    - { src: rocketmq-broker.service.j2, dest: /etc/systemd/system/rocketmq-broker.service }
  when: rocketmq_mode == 'standalone'
  notify: restart rocketmq

- name: Deploy 2m-2s-sync master/slave configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: rocketmq
    group: rocketmq
    mode: '0644'
    backup: true
  loop:
    - { src: master.properties.j2, dest: "{{ master_config }}" }
    - { src: slave.properties.j2, dest: "{{ slave_config }}" }
    - { src: rocketmq-master.service.j2, dest: /etc/systemd/system/rocketmq-master.service }
    - { src: rocketmq-slave.service.j2, dest: /etc/systemd/system/rocketmq-slave.service }
  when: rocketmq_mode == '2m-2s-sync'
  notify: restart rocketmq

- name: Deploy failover (DLedger) broker configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: rocketmq
    group: rocketmq
    mode: '0644'
    backup: true
  loop:
    - { src: broker.properties.j2, dest: "{{ broker_config }}" }
    - { src: rocketmq-broker.service.j2, dest: /etc/systemd/system/rocketmq-broker.service }
  when: rocketmq_mode == 'failover'
  notify: restart rocketmq

- name: Set JVM memory options for namesrv
  ansible.builtin.replace:
    path: "{{ rocketmq_root_path }}/bin/runserver.sh"
    regexp: '-Xms\d+g -Xmx\d+g'
    replace: '{{ namesrv_jvm_memory }}'

- name: Set JVM memory options for broker
  ansible.builtin.replace:
    path: "{{ rocketmq_root_path }}/bin/runbroker.sh"
    regexp: '-Xms\d+g -Xmx\d+g'
    replace: '{{ broker_jvm_memory }}'

- name: Set rocketmq directory permissions
  ansible.builtin.file:
    path: "{{ rocketmq_root_path }}"
    owner: rocketmq
    group: rocketmq
    state: directory
    recurse: true
