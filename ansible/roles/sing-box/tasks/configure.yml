---
- name: Ensure sing-box config directory exists
  ansible.builtin.file:
    path: "{{ sing_box_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure sing-box log directory exists
  ansible.builtin.file:
    path: "{{ sing_box_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy sing-box configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ sing_box_config_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart sing-box

- name: Enable and start sing-box
  ansible.builtin.systemd:
    name: sing-box
    state: started
    enabled: true
    daemon_reload: true
