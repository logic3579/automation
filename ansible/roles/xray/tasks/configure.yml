---
- name: Ensure xray config directory exists
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure xray log directory exists
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Ensure xray log directory exists
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    owner: nobody
    group: nobody
    mode: '0755'
  when: ansible_os_family == "RedHat"

- name: Deploy xray configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_config_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart xray

- name: Enable and start xray
  ansible.builtin.systemd:
    name: xray
    state: started
    enabled: true
    daemon_reload: true
