---
# proj-dev connects to EC2 instance IDs through EC2 Instance Connect and an
# SSH tunnel provided by Systems Manager Session Manager.
ansible_user: ssm-user
ansible_port: 22
ansible_ssh_private_key_file: keys/aws_ssm_key
ansible_ssh_common_args: >-
  -o ProxyCommand="sh -c 'aws ec2-instance-connect send-ssh-public-key
  --profile proj-dev
  --instance-id %h
  --instance-os-user %r
  --ssh-public-key file://keys/aws_ssm_key.pub
  >/dev/null && exec aws ssm start-session
  --profile proj-dev
  --target %h
  --document-name AWS-StartSSHSession
  --parameters portNumber=%p'"

ansible_become_method: sudo
ansible_become_user: root
