---
# Ansible debug toolkit — quick smoke tests for vault, inventory,
# templating, lookup plugins, and host facts. Default target is localhost
# so no SSH or remote credentials are needed.
#
# Run everything (except heavy opt-in dumps):
#   ansible-playbook playbooks/debug.yml --ask-vault-pass
#
# Target a remote group/host instead of localhost:
#   ansible-playbook playbooks/debug.yml -e target=kafka_cluster_kvm
#
# Run a single section via tags:
#   ansible-playbook playbooks/debug.yml --tags ping
#   ansible-playbook playbooks/debug.yml --tags vault --ask-vault-pass
#   ansible-playbook playbooks/debug.yml --tags inventory
#   ansible-playbook playbooks/debug.yml --tags facts
#   ansible-playbook playbooks/debug.yml --tags lookup
#   ansible-playbook playbooks/debug.yml --tags template
#   ansible-playbook playbooks/debug.yml --tags shell
#
# Opt-in heavy sections (excluded from default run via `never` tag):
#   ansible-playbook playbooks/debug.yml --tags facts_full   # full ansible_facts dump
#   ansible-playbook playbooks/debug.yml --tags env          # full env vars
- name: Ansible debug toolkit
  hosts: "{{ target | default('localhost') }}"
  gather_facts: true
  vars:
    # Demo vault value — same encrypted blob used in kvm-init so one vault
    # password verifies them both. Re-encrypt with:
    #   ansible-vault encrypt_string 'your_secret' --name 'demo_vault_value'
    demo_vault_value: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      31626630386363616332343237613935353564623839663239663733643933323436336432376535
      3639343335393235626531633163633534313737616666660a633335303465396366353234356136
      66356237623337346266646134313031363761633566373134353030636435303535353631346631
      6333353862363435350a333433663433376364666336633866663162326264616139633438623062
      3537
  tasks:

    # ----- 1. Connectivity ping -----
    - name: Ping target
      ansible.builtin.ping:
      tags: ping

    # ----- 2. Vault decryption -----
    - name: Decrypt and print demo vault value
      ansible.builtin.debug:
        msg: "decrypted demo_vault_value = {{ demo_vault_value }}"
      tags: vault

    # ----- 3. Inventory / play-runtime introspection -----
    - name: Show inventory + play context
      ansible.builtin.debug:
        msg:
          inventory_hostname: "{{ inventory_hostname }}"
          inventory_dir: "{{ inventory_dir }}"
          group_names: "{{ group_names }}"
          play_batch: "{{ ansible_play_batch }}"
          play_hosts_all: "{{ ansible_play_hosts_all }}"
          ansible_user: "{{ ansible_user | default('(default)') }}"
          ansible_port: "{{ ansible_port | default('(default)') }}"
      tags: inventory

    # ----- 4. Key facts (curated subset — the 10 fields you actually want) -----
    - name: Show key host facts
      ansible.builtin.debug:
        msg:
          default_ipv4: "{{ ansible_facts.default_ipv4.address | default('n/a') }}"
          fqdn: "{{ ansible_facts.fqdn | default('n/a') }}"
          hostname: "{{ ansible_facts.hostname | default('n/a') }}"
          os_family: "{{ ansible_facts.os_family | default('n/a') }}"
          distribution: "{{ ansible_facts.distribution | default('n/a') }} {{ ansible_facts.distribution_version | default('') }}"
          architecture: "{{ ansible_facts.architecture | default('n/a') }}"
          kernel: "{{ ansible_facts.kernel | default('n/a') }}"
          memory_total_mb: "{{ ansible_facts.memtotal_mb | default('n/a') }}"
          cpu_cores: "{{ ansible_facts.processor_cores | default('n/a') }}"
          virtualization_type: "{{ ansible_facts.virtualization_type | default('n/a') }}"
      tags: facts

    # ----- 5. Lookup plugin smoke test -----
    - name: Test lookup plugins
      ansible.builtin.debug:
        msg:
          env_user: "{{ lookup('env', 'USER') }}"
          env_home: "{{ lookup('env', 'HOME') }}"
          devops_pub_head: >-
            {{ lookup('file', inventory_dir ~ '/../keys/devops_key.pub', errors='ignore')
               | default('keys/devops_key.pub missing', true) | truncate(60) }}
          pipe_uptime: "{{ lookup('pipe', 'uptime') | trim }}"
      tags: lookup

    # ----- 6. Templating / Jinja playground -----
    - name: Show templated values
      ansible.builtin.debug:
        msg:
          host_index: "{{ ansible_play_batch.index(inventory_hostname) }}"
          host_count: "{{ ansible_play_batch | length }}"
          today_iso: "{{ ansible_facts.date_time.iso8601 | default('n/a') }}"
          today_epoch: "{{ ansible_facts.date_time.epoch | default('n/a') }}"
          random_int: "{{ 99999 | random }}"
          upper: "{{ ('hello' ~ ' ' ~ inventory_hostname) | upper }}"
      tags: template

    # ----- 7. Shell smoke test (read-only command) -----
    - name: Run uname
      ansible.builtin.command: uname -a
      register: debug_uname
      changed_when: false
      tags: shell

    - name: Print uname output
      ansible.builtin.debug:
        msg: "{{ debug_uname.stdout }}"
      tags: shell

    # ===== Opt-in heavy sections (skipped by default via `never` tag) =====

    # Full ansible_facts dump — useful when you need a field not covered by
    # the curated `facts` block above. Hundreds of lines.
    - name: Dump full ansible_facts
      ansible.builtin.debug:
        var: ansible_facts
      tags: [never, facts_full]

    # Full environment variable dump (controller-side or remote-side).
    - name: Dump environment variables
      ansible.builtin.debug:
        var: ansible_facts.env
      tags: [never, env]
