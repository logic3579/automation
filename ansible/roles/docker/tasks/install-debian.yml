---
- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ _docker_apt_url }}/gpg"
    dest: "{{ _docker_apt_keyring }}"
    owner: root
    group: root
    mode: '0644'
    force: false

- name: Deploy Docker apt source
  ansible.builtin.template:
    src: docker.sources.j2
    dest: "{{ _docker_apt_sources }}"
    owner: root
    group: root
    mode: '0644'

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ _docker_packages }}"
    state: present
    update_cache: true
