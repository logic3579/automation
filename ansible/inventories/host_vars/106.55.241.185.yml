---
# Host-specific overrides for tencent (106.55.241.185).
#
# Use case: VMess inbound for overseas → China reverse VPN. No GFW concern on
# this direction, so plain VMess over TCP is sufficient (no TLS / no REALITY).
# Ensure the Tencent Cloud security group allows 443/tcp inbound from the
# overseas client side before applying.
#
# Deploy:
#   uv run ansible-playbook -i inventories/tencent.ini playbooks/xray.yml --limit tencent --vault-id pwd.vault

xray_protocol: vmess
xray_port: 443

# Generate + encrypt the UUID, then paste the !vault block here:
#   UUID=$(uuidgen) && echo "$UUID"
#   uv run ansible-vault encrypt_string "$UUID" --name 'xray_uuid' [--vault-id pwd.vault]
xray_uuid: !vault |
  $ANSIBLE_VAULT;1.1;AES256
