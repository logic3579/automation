---
# Usage:
# standalone
#   ansible-playbook -e "hosts_var=10.0.10.12" playbooks/kafka.yml
# cluster
#   ansible-playbook -e "hosts_var=10.0.10.12,10.0.10.13,10.0.10.14" playbooks/kafka.yml

- hosts: "{{ hosts_var }}"
  remote_user: root
  become: true
  become_method: su
  gather_facts: false
  serial: 1
  roles:
    - kafka
