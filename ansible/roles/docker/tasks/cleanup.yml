---
- name: Deploy docker-cleanup service unit
  ansible.builtin.template:
    src: docker-cleanup.service.j2
    dest: /etc/systemd/system/docker-cleanup.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker-cleanup timer

- name: Deploy docker-cleanup timer unit
  ansible.builtin.template:
    src: docker-cleanup.timer.j2
    dest: /etc/systemd/system/docker-cleanup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker-cleanup timer

- name: Enable and start docker-cleanup timer
  ansible.builtin.systemd:
    name: docker-cleanup.timer
    state: started
    enabled: true
    daemon_reload: true
