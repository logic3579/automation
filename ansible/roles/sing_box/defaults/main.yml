---
# Protocol template selector:
#   vmess         - VMess over plain TCP (default; terminate TLS upstream)
#   vless-reality - VLESS + REALITY (TLS fingerprint masquerade)
sing_box_protocol: vmess

# Inbound listen port (provider security group / VPS network ACL must allow 443)
sing_box_port: 443

# Client UUID — vault-encrypt before use:
#   uv run ansible-vault encrypt_string 'your_uuid' --name 'sing_box_uuid' --vault-id pwd.vault
