---
# Cloud / third-party VPS initialization playbook.
#
# Bootstrap connection: the cloud image's default user (ubuntu/ec2-user) with
# devops_key.pub pre-injected at VM creation time, authenticated via devops_key.
# Same flow applies to third-party VPS providers (Vultr, DigitalOcean, Hetzner)
# as long as they ship with ubuntu + the public key pre-injected.
#
# The host firewall stays disabled — cloud security groups / VPC firewall rules
# (or the VPS provider's own network ACL) handle ingress. The sshd role still
# runs as defense in depth (key-only auth, restricted root login), which is
# particularly important for VPS hosts that lack provider-managed network ACLs.
#
# After init, hosts are reachable as devops@22 via keys/devops_key.
#
# Usage:
#   # Managed cloud
#   ansible-playbook -i inventories/init.ini playbooks/cloud-init.yml --limit cloud_aws
#   ansible-playbook -i inventories/init.ini playbooks/cloud-init.yml --limit cloud_gcp
#   ansible-playbook -i inventories/init.ini playbooks/cloud-init.yml --limit cloud_aliyun
#   ansible-playbook -i inventories/init.ini playbooks/cloud-init.yml --limit cloud_tencent
#   # Third-party VPS (Vultr / DigitalOcean / Hetzner ...)
#   ansible-playbook -i inventories/init.ini playbooks/cloud-init.yml --limit cloud_vps
- name: Cloud VM bootstrap
  hosts: all
  become: true
  vars:
    ansible_user: ubuntu
    ansible_port: 22
    ansible_ssh_private_key_file: keys/devops_key
    hostname_mode: fqdn_short
    security_firewall_enabled: false
    user_ssh_public_key: "{{ lookup('file', playbook_dir ~ '/../keys/devops_key.pub') }}"
  roles:
    - hostname
    - audit
    - ntp
    - security
    - sysctl
    - user
    - sshd
